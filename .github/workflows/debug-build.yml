name: Debug build

# Compiles the app and uploads an installable debug APK as a workflow artifact.
on:
  push:
    branches: [my-changes]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pause-debug-apk
          path: app/build/outputs/apk/debug/*.apk
